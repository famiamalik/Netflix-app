name: CI - Build and Push Docker Images

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: famiamalik/netflix-frontend:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: famiamalik/netflix-backend:${{ github.sha }}

      - name: Update K8s manifests with new image tags
        run: |
          sed -i "s|famiamalik/netflix-frontend:.*|famiamalik/netflix-frontend:${{ github.sha }}|g" k8s/frontend-deployment.yaml
          sed -i "s|famiamalik/netflix-backend:.*|famiamalik/netflix-backend:${{ github.sha }}|g" k8s/backend-deployment.yaml

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/
          git commit -m "CI: update image tags to ${{ github.sha }}"
          git push
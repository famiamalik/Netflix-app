apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netflix-frontend
  template:
    metadata:
      labels:
        app: netflix-frontend
    spec:
      containers:
        - name: frontend
          image: famiamalik/netflix-frontend:1a69ec2cf426163dc4dcd158f29f96d152c8656c
          ports:
            - containerPort: 80
          env:
            - name: VITE_APP_API_ENDPOINT_URL
              value: "http://netflix-backend-svc:5000"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netflix-frontend
  template:
    metadata:
      labels:
        app: netflix-frontend
    spec:
      containers:
        - name: frontend
          image: famiamalik/netflix-frontend:1aa83d93fb8d554a6e6dd3c3ab5da81d89b4391c
          ports:
            - containerPort: 80
          env:
            - name: VITE_APP_API_ENDPOINT_URL
              value: "http://netflix-backend-svc:5000"